# House rules for the whole system. Code reads every number from here.

bars: 1d
bars_per_year: 252
cost_per_side: 0.0005        # 0.05% of traded value on every buy and sell
starting_capital: 100000

windows:
  warmup_start: "2020-07-01"   # fills the 200-day lines before training starts
  train_start: "2022-01-03"
  train_end: "2024-12-31"
  locked_start: "2025-01-02"   # locked test: run once per candidate, never tuned on
  locked_end: null             # null = latest bar available

tickers:
  market: SPY
  cash: BIL
  engine_candidates: [QQQ, SPY]
  safe_candidates: [BIL, SHY, IEF, TLT, GLD]
  sleeves: [SPY, QQQ, DIA, IWM, XLF, XLE, XLK, XLY, XLP, XLU, XLI, XLB, XLV, TLT, GLD]

core:
  engine: QQQ
  safe: GLD
  line_days: 200
  neighbors:                   # every one of these must also make money in training
    - {line_days: 100, kind: sma}
    - {line_days: 150, kind: sma}
    - {line_days: 250, kind: sma}
    - {line_days: 200, kind: ema}

sleeve_families:
  dip_buy:
    label: snaps_back
    min_trades: 15
    signal: {rsi_len: 2, rsi_below: 10, trend_len: 200, exit_sma: 5}
    engine: {stop_pct: 0.08, max_hold: 10}
    neighbors:                 # one setting moved one step at a time
      rsi_below: [5, 15]
      exit_sma: [3, 7]
      trend_len: [150, 250]
      max_hold: [8, 12]
      stop_pct: [0.06, 0.10]
  breakout:
    label: keeps_going
    min_trades: 6
    signal: {high_len: 50, low_len: 20, trend_len: 200}
    engine: {stop_pct: 0.08, max_hold: null}
    neighbors:
      high_len: [40, 60]
      low_len: [15, 25]
      trend_len: [150, 250]
      stop_pct: [0.06, 0.10]

gates:
  min_profit_factor: 1.3

labels:
  snaps_back: {min_events: 12, forward_days: 5}
  keeps_going: {min_events: 6, forward_days: 20}

account:
  max_sleeves: 3
  slot: 0.20                   # share of equity each live sleeve trade takes
  max_correlation: 0.60        # between any two chosen sleeves' daily returns
  vix_half_size_above: 20      # sleeve entries on a signal day with VIX above this take half a slot
  margin: false                # false = sleeves are funded out of the core; true = borrowed on top
  margin_rate: 0.068

permutation:
  n: 1000
  max_p_value: 0.01
  seed: 11
